<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Light Slate Glow) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </radialGradient>

    <!-- Soft Clinical Glow for Patient Dot -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Path Soft Glow -->
    <filter id="pathGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; letter-spacing: 0.08em; }
    .label-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; }
    .quadrant-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
    .axis-title { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; font-weight: 600; letter-spacing: 0.1em; }
    
    /* Animation Keyframes */
    @keyframes pulse {
      0% { r: 6px; opacity: 0.95; }
      50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 4px #0ea5e9); }
      100% { r: 6px; opacity: 0.95; }
    }
    
    @keyframes pulse-slow {
      0% { opacity: 0.45; }
      50% { opacity: 0.75; }
      100% { opacity: 0.45; }
    }

    @keyframes path-dash {
      to { stroke-dashoffset: -40; }
    }

    .patient-dot {
      fill: #0ea5e9;
      animation: pulse 2s infinite ease-in-out;
    }

    .cohort-dot {
      opacity: 0.6;
      animation: pulse-slow 3s infinite ease-in-out;
    }
    
    .cohort-dot.mhnw { fill: #0d9488; }
    .cohort-dot.ir { fill: #d97706; }
    .cohort-dot.steatosis { fill: #2563eb; }
    .cohort-dot.dual { fill: #e11d48; }

    .geodesic-line {
      stroke: #0ea5e9;
      stroke-width: 2.5;
      stroke-dasharray: 6 4;
      animation: path-dash 2s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" rx="16" stroke="#e2e8f0" stroke-width="2" />

  <!-- Subdued Grid Layout -->
  <g opacity="0.45">
    <line x1="50" y1="50" x2="650" y2="50" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="100" x2="650" y2="100" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="150" x2="650" y2="150" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="200" x2="650" y2="200" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="250" x2="650" y2="250" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="300" x2="650" y2="300" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="350" x2="650" y2="350" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="400" x2="650" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />

    <line x1="100" y1="50" x2="100" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="150" y1="50" x2="150" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="200" y1="50" x2="200" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="250" y1="50" x2="250" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="300" y1="50" x2="300" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="350" y1="50" x2="350" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="400" y1="50" x2="400" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="450" y1="50" x2="450" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="50" y1="50" x2="50" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="500" y1="50" x2="500" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="550" y1="50" x2="550" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="600" y1="50" x2="600" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
    <line x1="650" y1="50" x2="650" y2="400" stroke="#cbd5e1" stroke-dasharray="2 4" />
  </g>

  <!-- Central Origin Axes (Threshold Boundaries) -->
  <line x1="350" y1="35" x2="350" y2="415" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="35" y1="225" x2="665" y2="225" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Quadrant Titles & Background Panels (Soft Translucent Pastel Fills) -->
  <!-- Top Left: IR-Dominant -->
  <rect x="50" y="50" width="280" height="160" fill="#f59e0b" opacity="0.04" rx="8" />
  <text x="70" y="80" class="quadrant-title" fill="#b45309">QUADRANT II: IR-DOMINANT</text>
  
  <!-- Top Right: Dual Burden -->
  <rect x="370" y="50" width="280" height="160" fill="#f43f5e" opacity="0.05" rx="8" />
  <text x="390" y="80" class="quadrant-title" fill="#be123c">QUADRANT III: DUAL-BURDEN (THIN-FAT)</text>

  <!-- Bottom Left: MHNW -->
  <rect x="50" y="240" width="280" height="160" fill="#14b8a6" opacity="0.04" rx="8" />
  <text x="70" y="380" class="quadrant-title" fill="#0f766e">QUADRANT I: HEALTHY (MHNW)</text>

  <!-- Bottom Right: Steatotic -->
  <rect x="370" y="240" width="280" height="160" fill="#3b82f6" opacity="0.04" rx="8" />
  <text x="390" y="380" class="quadrant-title" fill="#1d4ed8">QUADRANT IV: STEATOTIC-DOMINANT</text>

  <!-- Background Cohort Scatter Scatter Simulation -->
  <!-- MHNW Cluster (Dense around 150, 300) -->
  <circle cx="150" cy="300" r="3" class="cohort-dot mhnw" style="animation-delay: 0.1s;" />
  <circle cx="180" cy="340" r="2.5" class="cohort-dot mhnw" style="animation-delay: 0.5s;" />
  <circle cx="210" cy="280" r="3" class="cohort-dot mhnw" style="animation-delay: 0.9s;" />
  <circle cx="120" cy="320" r="3.5" class="cohort-dot mhnw" style="animation-delay: 0.2s;" />
  <circle cx="240" cy="310" r="2.5" class="cohort-dot mhnw" style="animation-delay: 1.4s;" />
  <circle cx="160" cy="270" r="3" class="cohort-dot mhnw" style="animation-delay: 0.7s;" />
  <circle cx="200" cy="350" r="3.5" class="cohort-dot mhnw" style="animation-delay: 1.1s;" />
  
  <!-- IR Cluster (Dense around 160, 130) -->
  <circle cx="140" cy="110" r="3" class="cohort-dot ir" style="animation-delay: 0.3s;" />
  <circle cx="180" cy="150" r="3" class="cohort-dot ir" style="animation-delay: 0.8s;" />
  <circle cx="220" cy="100" r="2.5" class="cohort-dot ir" style="animation-delay: 1.2s;" />
  <circle cx="110" cy="160" r="3.5" class="cohort-dot ir" style="animation-delay: 0.4s;" />
  <circle cx="250" cy="140" r="2.5" class="cohort-dot ir" style="animation-delay: 1.6s;" />

  <!-- Steatosis Cluster (Dense around 500, 310) -->
  <circle cx="480" cy="320" r="3" class="cohort-dot steatosis" style="animation-delay: 0.2s;" />
  <circle cx="520" cy="280" r="2.5" class="cohort-dot steatosis" style="animation-delay: 0.7s;" />
  <circle cx="450" cy="350" r="3.5" class="cohort-dot steatosis" style="animation-delay: 1.1s;" />
  <circle cx="560" cy="310" r="3" class="cohort-dot steatosis" style="animation-delay: 0.5s;" />
  <circle cx="490" cy="270" r="2.5" class="cohort-dot steatosis" style="animation-delay: 1.5s;" />

  <!-- Dual Burden Cluster (Dense around 510, 120) -->
  <circle cx="490" cy="90" r="3" class="cohort-dot dual" style="animation-delay: 0.4s;" />
  <circle cx="530" cy="140" r="3.5" class="cohort-dot dual" style="animation-delay: 0.9s;" />
  <circle cx="460" cy="120" r="2.5" class="cohort-dot dual" style="animation-delay: 1.3s;" />
  <circle cx="570" cy="100" r="3" class="cohort-dot dual" style="animation-delay: 0.6s;" />
  <circle cx="510" cy="160" r="2.5" class="cohort-dot dual" style="animation-delay: 1.8s;" />

  <!-- Center Crosshair -->
  <circle cx="350" cy="225" r="3" fill="#94a3b8" />

  <!-- The Geodesic Path (Cubic Bezier Curve) -->
  <path id="geodesicPath" d="M 520 120 C 440 220, 260 210, 180 310" fill="none" class="geodesic-line" />

  <!-- Start & End Targets -->
  <circle cx="520" cy="120" r="6" fill="#f43f5e" stroke="#fda4af" stroke-width="1.5" />
  <circle cx="180" cy="310" r="6" fill="#14b8a6" stroke="#99f6e4" stroke-width="1.5" />
  
  <text x="535" y="115" class="label-text" fill="#e11d48" font-weight="700">Patient Baseline (z_start)</text>
  <text x="90" y="335" class="label-text" fill="#0f766e" font-weight="700">Metabolic Target (z_safe)</text>

  <!-- Animated Patient Coordinate Dot -->
  <circle r="7" class="patient-dot" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" keyTimes="0;0.18;0.5;0.68;1" keyPoints="0;0;1;1;0" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1">
      <mpath href="#geodesicPath" />
    </animateMotion>
  </circle>

  <!-- Axes Labels -->
  <!-- X Axis: z1 -->
  <text x="630" y="245" class="axis-title">Z₁ (IR)</text>
  <path d="M 660 225 L 652 220 L 652 230 Z" fill="#94a3b8" />
  
  <!-- Y Axis: z2 -->
  <text x="365" y="45" class="axis-title">Z₂ (Steatosis)</text>
  <path d="M 350 35 L 345 43 L 355 43 Z" fill="#94a3b8" />

  <!-- Header Badge Overlay -->
  <rect x="230" y="15" width="240" height="30" fill="#f8fafc" rx="15" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="350" y="34" text-anchor="middle" class="title-text" fill="#0ea5e9">LIVE GEODESIC SOLVER</text>
  
  <!-- Running Metrics / Indicator -->
  <g transform="translate(490, 30)">
    <rect width="180" height="48" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1.2" />
    <!-- Pulse indicator -->
    <circle cx="18" cy="24" r="5" fill="#0ea5e9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="9px" fill="#64748b" font-weight="700" letter-spacing="0.05em">ODE INTEGRATION</text>
    <text x="32" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11px" fill="#0ea5e9" font-weight="700">dt = Pullback Metric</text>
  </g>
</svg>
