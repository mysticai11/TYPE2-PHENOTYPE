<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <!-- Background Soft Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fcfdfe" />
      <stop offset="100%" stop-color="#f3f6fa" />
    </radialGradient>

    <!-- Quadrant Specific Gradients -->
    <radialGradient id="safeGrad" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#00c47d" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00c47d" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="irGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="steatosisGrad" cx="100%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#3d8ef8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3d8ef8" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="dualGrad" cx="100%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#e8394a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#e8394a" stop-opacity="0.0" />
    </radialGradient>

    <!-- Path Gradient: Patient (Red) to Target (Teal) -->
    <linearGradient id="pathGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8394a" />
      <stop offset="40%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#00c47d" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="patientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0c1a30" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    
    /* Global classes */
    .canvas-bg { fill: url(#bgGlow); stroke: #e2e8f0; stroke-width: 1.5; }
    .quadrant-bg { stroke-width: 1; rx: 12; }
    
    /* Typography */
    .title-label { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; letter-spacing: 0.12em; }
    .quad-label { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .legend-label { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #64748b; font-weight: 500; }
    .axis-label { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #475569; font-weight: 600; letter-spacing: 0.12em; }
    .hud-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #6366f1; }
    
    /* Animation Easing */
    @keyframes pulse-halo {
      0% { r: 6px; opacity: 0.8; }
      100% { r: 16px; opacity: 0; }
    }
    @keyframes march-dots {
      to { stroke-dashoffset: -24; }
    }
    @keyframes ecg-pulsate {
      to { stroke-dashoffset: -80; }
    }
    @keyframes breathe-contour {
      0%, 100% { transform: scale(1.0); opacity: 0.1; }
      50% { transform: scale(1.02); opacity: 0.15; }
    }

    .geodesic-route {
      stroke: url(#pathGrad);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 5;
      animation: march-dots 1.5s linear infinite;
    }
    .patient-dot {
      fill: #e8394a;
      stroke: #ffffff;
      stroke-width: 2;
      filter: url(#patientGlow);
    }
    .halo-effect {
      fill: none;
      stroke: #e8394a;
      stroke-width: 1.5;
      animation: pulse-halo 2.2s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }
    .contour-line {
      fill: none;
      stroke: #94a3b8;
      stroke-width: 0.8;
      stroke-dasharray: 5 3;
      opacity: 0.12;
    }
    .ecg-path {
      stroke: #6366f1;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 20 60;
      animation: ecg-pulsate 2.5s linear infinite;
    }
    .interactive-quad:hover {
      filter: drop-shadow(0 4px 8px rgba(15, 23, 42, 0.04));
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="canvas-bg" rx="22" />

  <!-- Technical Coordinate Grid -->
  <g opacity="0.3">
    <!-- Grid vertical lines -->
    <line x1="60" y1="50" x2="60" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="120" y1="50" x2="120" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="180" y1="50" x2="180" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="240" y1="50" x2="240" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="300" y1="50" x2="300" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="360" y1="50" x2="360" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="420" y1="50" x2="420" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="480" y1="50" x2="480" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="540" y1="50" x2="540" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="600" y1="50" x2="600" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="660" y1="50" x2="660" y2="430" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    
    <!-- Grid horizontal lines -->
    <line x1="60" y1="80" x2="660" y2="80" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="60" y1="140" x2="660" y2="140" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="60" y1="200" x2="660" y2="200" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="60" y1="260" x2="660" y2="260" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="60" y1="320" x2="660" y2="320" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="60" y1="380" x2="660" y2="380" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2 3" />
  </g>

  <!-- Golden Threshold Intersecting Axes -->
  <line x1="360" y1="40" x2="360" y2="440" stroke="#d97706" stroke-width="1.5" opacity="0.6" />
  <line x1="50" y1="260" x2="670" y2="260" stroke="#d97706" stroke-width="1.5" opacity="0.6" />

  <!-- FOUR METABOLIC TERRITORIES -->
  
  <!-- Quadrant II: Insulin Resistant (Top-Left) -->
  <g class="interactive-quad" filter="url(#cardShadow)">
    <rect x="60" y="50" width="280" height="190" fill="url(#irGrad)" stroke="#fde68a" stroke-width="1" rx="12" />
    <text x="76" y="76" class="quad-label" fill="#d97706">QUADRANT II · INSULIN RESISTANT</text>
  </g>

  <!-- Quadrant III: Dual Burden (Top-Right) -->
  <g class="interactive-quad" filter="url(#cardShadow)">
    <rect x="380" y="50" width="280" height="190" fill="url(#dualGrad)" stroke="#fecdd3" stroke-width="1" rx="12" />
    <text x="396" y="76" class="quad-label" fill="#e11d48">QUADRANT III · DUAL-BURDEN (HIGH RISK)</text>
  </g>

  <!-- Quadrant I: Healthy MHNW (Bottom-Left) -->
  <g class="interactive-quad" filter="url(#cardShadow)">
    <rect x="60" y="270" width="280" height="160" fill="url(#safeGrad)" stroke="#a7f3d0" stroke-width="1" rx="12" />
    <text x="76" y="414" class="quad-label" fill="#059669">QUADRANT I · METABOLICALLY HEALTHY (MHNW)</text>
  </g>

  <!-- Quadrant IV: Steatotic Dominant (Bottom-Right) -->
  <g class="interactive-quad" filter="url(#cardShadow)">
    <rect x="380" y="270" width="280" height="160" fill="url(#steatosisGrad)" stroke="#bfdbfe" stroke-width="1" rx="12" />
    <text x="396" y="414" class="quad-label" fill="#2563eb">QUADRANT IV · STEATOTIC-DOMINANT</text>
  </g>

  <!-- COHORT CONTORS (Visual representation of NHANES density distribution) -->
  <!-- Contours around MHNW center (170, 350) -->
  <path d="M120 350 A 50 40 0 1 1 220 350 A 50 40 0 1 1 120 350 Z" class="contour-line" />
  <path d="M100 350 A 70 55 0 1 1 240 350 A 70 55 0 1 1 100 350 Z" class="contour-line" />
  <!-- Contours around Dual-Burden center (520, 140) -->
  <path d="M470 140 A 50 45 0 1 1 570 140 A 50 45 0 1 1 470 140 Z" class="contour-line" />
  <path d="M450 140 A 75 60 0 1 1 600 140 A 75 60 0 1 1 450 140 Z" class="contour-line" opacity="0.08" />

  <!-- STATIC REFERENCE COHORT REPRESENTATIVES -->
  <!-- Healthy Cluster -->
  <circle cx="160" cy="330" r="3" fill="#10b981" opacity="0.3" />
  <circle cx="190" cy="360" r="3.5" fill="#10b981" opacity="0.4" />
  <circle cx="210" cy="320" r="2.5" fill="#10b981" opacity="0.3" />
  <circle cx="130" cy="350" r="3" fill="#10b981" opacity="0.3" />
  <circle cx="175" cy="380" r="3.5" fill="#10b981" opacity="0.2" />
  <!-- IR Cluster -->
  <circle cx="180" cy="140" r="3" fill="#f5a623" opacity="0.35" />
  <circle cx="210" cy="170" r="3" fill="#f5a623" opacity="0.3" />
  <circle cx="150" cy="110" r="3.5" fill="#f5a623" opacity="0.25" />
  <!-- Steatotic Cluster -->
  <circle cx="490" cy="330" r="3" fill="#3d8ef8" opacity="0.35" />
  <circle cx="530" cy="360" r="3" fill="#3d8ef8" opacity="0.4" />
  <circle cx="460" cy="310" r="3.5" fill="#3d8ef8" opacity="0.2" />
  <!-- Dual Burden Cluster -->
  <circle cx="510" cy="110" r="3" fill="#e8394a" opacity="0.3" />
  <circle cx="550" cy="150" r="3.5" fill="#e8394a" opacity="0.35" />
  <circle cx="480" cy="130" r="3" fill="#e8394a" opacity="0.2" />

  <!-- Center Origin Marker -->
  <circle cx="360" cy="260" r="4" fill="#64748b" stroke="#ffffff" stroke-width="1" />

  <!-- GEODESIC SOLUTION PATHWAY (Rose to Green Gradient) -->
  <path id="geodesicPath" d="M 520 130 Q 430 250, 180 340" fill="none" class="geodesic-route" />

  <!-- Pathway Milestones -->
  <circle cx="520" cy="130" r="6" fill="#e8394a" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="180" cy="340" r="6" fill="#00c47d" stroke="#ffffff" stroke-width="1.5" />

  <text x="532" y="125" class="legend-label" fill="#e8394a" font-weight="700">Patient Baseline (z_start)</text>
  <text x="96" y="362" class="legend-label" fill="#00c47d" font-weight="700">Safe Target (z_safe)</text>

  <!-- GEODESIC DISTANCE mid-way waypoint marker -->
  <g transform="translate(325, 205)">
    <rect width="90" height="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="4" />
    <!-- Small Diamond Icon -->
    <rect x="6" y="6" width="8" height="8" fill="#00c47d" transform="rotate(45 10 10)" />
    <text x="24" y="13" font-family="'Outfit', sans-serif" font-size="8px" font-weight="700" fill="#334155">1.8 units to safe</text>
  </g>

  <!-- ACTIVE PATIENT PIN (Moves along the solved Geodesic Pathway) -->
  <g>
    <!-- Pulsing ring behind -->
    <circle r="6" class="halo-effect" />
    <!-- Pin dot -->
    <circle r="5.5" class="patient-dot" />
    
    <!-- Motion animation along the path -->
    <animateMotion dur="7.5s" repeatCount="indefinite" keyTimes="0; 0.2; 0.55; 0.75; 1" keyPoints="0; 0; 1; 1; 0" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1">
      <mpath href="#geodesicPath" />
    </animateMotion>
  </g>

  <!-- AXIS TITLES -->
  <g transform="translate(620, 280)">
    <text x="0" y="0" class="axis-label">Z₁ (INSULIN RESISTANCE) →</text>
  </g>
  <g transform="translate(375, 45)">
    <text x="0" y="0" class="axis-label" transform="rotate(-90)">LIVER FAT (Z₂) →</text>
  </g>

  <!-- CLINICAL HUD HEADER / MONITOR -->
  <g transform="translate(260, 15)">
    <rect width="240" height="28" fill="#ffffff" rx="14" stroke="#e2e8f0" stroke-width="1" />
    <text x="120" y="18" text-anchor="middle" class="title-label">METABOLIC MAP RESOLVER</text>
  </g>

  <!-- PHYSIOLOGICAL telemetry / monitor card -->
  <g transform="translate(540, 290)">
    <!-- Card Frame -->
    <rect width="160" height="60" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Pulse signal dot -->
    <circle cx="16" cy="30" r="4" fill="#6366f1">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <!-- Tiny ECG trace -->
    <path d="M 100 30 L 110 30 L 114 18 L 118 40 L 122 30 L 145 30" fill="none" class="ecg-path" />
    
    <!-- Metric texts -->
    <text x="28" y="22" font-family="'Outfit', sans-serif" font-size="8px" font-weight="700" fill="#94a3b8" letter-spacing="0.08em">OPTIMIZATION TELEMETRY</text>
    <text x="28" y="36" class="hud-text">Riemannian-Geodesic</text>
    <text x="28" y="48" font-family="'Outfit', sans-serif" font-size="8px" fill="#64748b">Status: Solved (Tol &lt; 1e-6)</text>
  </g>
</svg>
