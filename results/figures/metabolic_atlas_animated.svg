<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="60%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Quadrant Neon Radial Glows -->
    <radialGradient id="healthyGlow" cx="0%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="irGlow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="steatosisGlow" cx="100%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </radialGradient>
    <radialGradient id="dualGlow" cx="100%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
    </radialGradient>

    <!-- Path Gradient: Patient (Red/Rose) to Target (Emerald) -->
    <linearGradient id="geodesicGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="patientHalo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=Fira+Code:wght@500;700&amp;display=swap');
    
    /* Global canvas & container settings */
    .canvas-rect { fill: url(#bgGrad); stroke: #1e293b; stroke-width: 1.5; }
    .quadrant-box { stroke-width: 1.5; rx: 16; }
    
    /* Typography style classes */
    .header-text { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.15em; }
    .quad-label-text { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
    .axis-title { font-family: 'Outfit', sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 600; letter-spacing: 0.12em; }
    .hud-label { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; fill: #6366f1; }
    .legend-text { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #64748b; font-weight: 500; }
    
    /* Animations */
    @keyframes pulse-ring {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes dash-march {
      to { stroke-dashoffset: -32; }
    }
    @keyframes telemetry-ping {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes breathing {
      0%, 100% { transform: scale(1.0); }
      50% { transform: scale(1.015); }
    }

    .geodesic-path {
      stroke: url(#geodesicGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 8 6;
      animation: dash-march 2s linear infinite;
      filter: url(#neonBlur);
    }
    .active-patient {
      fill: #ef4444;
      stroke: #ffffff;
      stroke-width: 2.5;
      filter: url(#patientHalo);
    }
    .pulse-halo-circle {
      fill: none;
      stroke: #ef4444;
      stroke-width: 2;
      animation: pulse-ring 2s infinite cubic-bezier(0.1, 0.8, 0.3, 1);
    }
    .telemetry-ecg {
      stroke: #6366f1;
      stroke-width: 1.5;
      fill: none;
      stroke-dasharray: 25 75;
      animation: dash-march 3s linear infinite;
    }
    .telemetry-dot {
      fill: #6366f1;
      animation: telemetry-ping 1.5s infinite ease-in-out;
    }
    
    .interactive-card {
      transition: all 0.3s ease;
    }
    .interactive-card:hover {
      opacity: 0.95;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="canvas-rect" rx="28" />

  <!-- High-Tech Tech Grid Layer -->
  <g opacity="0.15">
    <line x1="70" y1="60" x2="70" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="140" y1="60" x2="140" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="210" y1="60" x2="210" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="280" y1="60" x2="280" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="350" y1="60" x2="350" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="420" y1="60" x2="420" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="490" y1="60" x2="490" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="560" y1="60" x2="560" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="630" y1="60" x2="630" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="700" y1="60" x2="700" y2="440" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    
    <line x1="60" y1="100" x2="740" y2="100" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="60" y1="160" x2="740" y2="160" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="60" y1="220" x2="740" y2="220" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="60" y1="280" x2="740" y2="280" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="60" y1="340" x2="740" y2="340" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
    <line x1="60" y1="400" x2="740" y2="400" stroke="#475569" stroke-width="0.7" stroke-dasharray="2 4" />
  </g>

  <!-- Golden Threshold Intersecting Axes -->
  <!-- Z1 Threshold (Vertical) -->
  <line x1="385" y1="50" x2="385" y2="450" stroke="#d97706" stroke-width="2" stroke-dasharray="4 2" opacity="0.7" />
  <!-- Z2 Threshold (Horizontal) -->
  <line x1="50" y1="250" x2="750" y2="250" stroke="#d97706" stroke-width="2" stroke-dasharray="4 2" opacity="0.7" />

  <!-- FOUR PHENOTYPIC TERRITORIES -->
  
  <!-- Quadrant II: IR-Dominant (Top-Left) -->
  <g class="interactive-card" filter="url(#cardShadow)">
    <rect x="70" y="60" width="295" height="175" fill="url(#irGlow)" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.3" rx="16" />
    <text x="86" y="86" class="quad-label-text" fill="#f5a623">QUADRANT II · INSULIN RESISTANT</text>
  </g>

  <!-- Quadrant III: Dual Burden (Top-Right) -->
  <g class="interactive-card" filter="url(#cardShadow)">
    <rect x="405" y="60" width="295" height="175" fill="url(#dualGlow)" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.3" rx="16" />
    <text x="421" y="86" class="quad-label-text" fill="#ef4444">QUADRANT III · DUAL-BURDEN (HIGH-RISK)</text>
  </g>

  <!-- Quadrant I: Healthy MHNW (Bottom-Left) -->
  <g class="interactive-card" filter="url(#cardShadow)">
    <rect x="70" y="265" width="295" height="175" fill="url(#healthyGlow)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.3" rx="16" />
    <text x="86" y="420" class="quad-label-text" fill="#10b981">QUADRANT I · METABOLICALLY HEALTHY (MHNW)</text>
  </g>

  <!-- Quadrant IV: Steatosis-Dominant (Bottom-Right) -->
  <g class="interactive-card" filter="url(#cardShadow)">
    <rect x="405" y="265" width="295" height="175" fill="url(#steatosisGlow)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.3" rx="16" />
    <text x="421" y="420" class="quad-label-text" fill="#3b82f6">QUADRANT IV · STEATOSIS-DOMINANT</text>
  </g>

  <!-- Density Contours (Simulating NHANES Cluster Density) -->
  <!-- Healthy (Quadrant I Center) -->
  <path d="M140 350 A 60 50 0 1 1 260 350 A 60 50 0 1 1 140 350 Z" fill="none" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.25" />
  <path d="M120 350 A 85 70 0 1 1 290 350 A 85 70 0 1 1 120 350 Z" fill="none" stroke="#10b981" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.15" />
  <!-- Dual Burden (Quadrant III Center) -->
  <path d="M495 140 A 65 55 0 1 1 625 140 A 65 55 0 1 1 495 140 Z" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.2" />
  <path d="M475 140 A 90 75 0 1 1 655 140 A 90 75 0 1 1 475 140 Z" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.1" />

  <!-- Scatter Plots (Cohort Representational Coordinates) -->
  <circle cx="170" cy="330" r="3" fill="#10b981" opacity="0.4" />
  <circle cx="210" cy="360" r="2.5" fill="#10b981" opacity="0.5" />
  <circle cx="240" cy="315" r="3.5" fill="#10b981" opacity="0.3" />
  <circle cx="135" cy="365" r="2" fill="#10b981" opacity="0.4" />
  <circle cx="180" cy="385" r="3" fill="#10b981" opacity="0.3" />
  <circle cx="190" cy="130" r="3" fill="#f5a623" opacity="0.45" />
  <circle cx="225" cy="160" r="3.5" fill="#f5a623" opacity="0.4" />
  <circle cx="150" cy="115" r="2.5" fill="#f5a623" opacity="0.3" />
  <circle cx="510" cy="335" r="3" fill="#3b82f6" opacity="0.45" />
  <circle cx="560" cy="370" r="3" fill="#3b82f6" opacity="0.5" />
  <circle cx="485" cy="310" r="2.5" fill="#3b82f6" opacity="0.3" />
  <circle cx="530" cy="115" r="3" fill="#ef4444" opacity="0.4" />
  <circle cx="570" cy="155" r="3.5" fill="#ef4444" opacity="0.45" />
  <circle cx="475" cy="135" r="2.5" fill="#ef4444" opacity="0.3" />

  <!-- Center Coordinate Marker -->
  <circle cx="385" cy="250" r="5" fill="#475569" stroke="#070a13" stroke-width="1.5" />

  <!-- GEODESIC SOLUTION ROUTE -->
  <path id="geodesicRoute" d="M 545 135 Q 460 250, 210 345" fill="none" class="geodesic-path" />

  <!-- Route Terminals -->
  <circle cx="545" cy="135" r="7.5" fill="#ef4444" stroke="#070a13" stroke-width="2" />
  <circle cx="210" cy="345" r="7.5" fill="#10b981" stroke="#070a13" stroke-width="2" />

  <text x="560" y="130" class="legend-text" fill="#ef4444" font-weight="700">Patient Baseline (z_start)</text>
  <text x="125" y="365" class="legend-text" fill="#10b981" font-weight="700">Target Resolved (z_safe)</text>

  <!-- Telemetry Waypoint Flag -->
  <g transform="translate(345, 195)">
    <rect width="100" height="22" fill="#0b1329" stroke="#1e293b" stroke-width="1" rx="6" />
    <circle cx="12" cy="11" r="3" fill="#10b981" />
    <text x="26" y="14" font-family="'Outfit', sans-serif" font-size="8px" font-weight="700" fill="#f8fafc">1.8 units to safe</text>
  </g>

  <!-- ANIMATED PULSING PATIENT PIN -->
  <g>
    <!-- Concentric pulsing rings -->
    <circle r="7" class="pulse-halo-circle" />
    <!-- Center Dot -->
    <circle r="6" class="active-patient" />
    
    <!-- Motion along path -->
    <animateMotion dur="6s" repeatCount="indefinite" keyTimes="0; 0.15; 0.55; 0.75; 1" keyPoints="0; 0; 1; 1; 0" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1">
      <mpath href="#geodesicRoute" />
    </animateMotion>
  </g>

  <!-- AXIS TITLES -->
  <text x="630" y="270" class="axis-title">Z₁ (INSULIN RESISTANCE) →</text>
  <text x="400" y="75" class="axis-title" transform="rotate(90 400 75)">Z₂ (HEPATIC STEATOSIS) →</text>

  <!-- HUD DASHBOARD WINDOW -->
  <g transform="translate(265, 12)">
    <!-- Glassmorphic HUD Frame -->
    <rect width="270" height="32" fill="#0b132a" rx="16" stroke="#334155" stroke-width="1.2" />
    <!-- Dynamic status dot -->
    <circle cx="20" cy="16" r="4" class="telemetry-dot" />
    <text x="145" y="21" text-anchor="middle" class="header-text">METABOLIC ATLAS RESOLVER</text>
  </g>

  <!-- HUD REALTIME GEODESIC TELEMETRY CARD -->
  <g transform="translate(565, 305)">
    <!-- Glassmorphic Card Panel -->
    <rect width="180" height="70" fill="#090e1f" rx="10" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Pulse ECG Trace -->
    <path d="M 120 35 L 128 35 L 132 20 L 136 48 L 140 35 L 165 35" fill="none" class="telemetry-ecg" />
    
    <!-- HUD details -->
    <text x="16" y="22" font-family="'Outfit', sans-serif" font-size="8px" font-weight="700" fill="#94a3b8" letter-spacing="0.08em">OPTIMIZATION ENGINE</text>
    <text x="16" y="38" class="hud-label">Riemannian-Geodesic</text>
    <text x="16" y="52" font-family="'Outfit', sans-serif" font-size="8.5px" fill="#64748b">Status: Solved (Tol &lt; 1e-6)</text>
  </g>
</svg>
