<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Soft Professional Clinical Light Blue-Grey Glow) -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>

    <!-- Glowing effect for the active patient coordinate -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Geodesic Path Gradient: Red/Rose (Risk) to Teal/Green (Safe) -->
    <linearGradient id="geodesicGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />   <!-- High Risk (Rose) -->
      <stop offset="50%" stop-color="#6366f1" />  <!-- Transition (Indigo) -->
      <stop offset="100%" stop-color="#0d9488" /> <!-- Safe Target (Teal) -->
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap');
    
    .title-text { font-family: 'Outfit', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #0f172a; font-weight: 700; letter-spacing: 0.1em; }
    .label-text { font-family: 'Outfit', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
    .quadrant-title { font-family: 'Outfit', system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .axis-title { font-family: 'Outfit', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; font-weight: 600; letter-spacing: 0.12em; }
    
    /* Animation Keyframes */
    @keyframes pulse-ring {
      0% { r: 7px; opacity: 0.5; }
      50% { r: 15px; opacity: 0; filter: drop-shadow(0 0 6px #6366f1); }
      100% { r: 7px; opacity: 0.5; }
    }
    
    @keyframes pulse-slow {
      0% { opacity: 0.35; }
      50% { opacity: 0.70; }
      100% { opacity: 0.35; }
    }

    @keyframes path-dash {
      to { stroke-dashoffset: -30; }
    }

    @keyframes ecg-dash {
      to { stroke-dashoffset: -120; }
    }

    .geodesic-line {
      stroke: url(#geodesicGrad);
      stroke-width: 3.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 7 5;
      animation: path-dash 1.8s linear infinite;
    }

    .patient-core-dot {
      fill: #6366f1;
      stroke: #ffffff;
      stroke-width: 1.5;
      filter: url(#glow);
    }

    .patient-pulse-ring {
      fill: none;
      stroke: #6366f1;
      stroke-width: 2.0;
      animation: pulse-ring 2s infinite ease-out;
    }

    .cohort-dot {
      opacity: 0.55;
      animation: pulse-slow 3s infinite ease-in-out;
    }
    
    .cohort-dot.mhnw { fill: #0d9488; }
    .cohort-dot.ir { fill: #d97706; }
    .cohort-dot.steatosis { fill: #2563eb; }
    .cohort-dot.dual { fill: #e11d48; }
    
    .ecg-path {
      stroke: #6366f1;
      stroke-width: 1.5;
      stroke-dasharray: 40 80;
      animation: ecg-dash 3s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" rx="18" stroke="#e2e8f0" stroke-width="2" />

  <!-- Ultra-Crisp Grid Layout -->
  <g opacity="0.35">
    <line x1="50" y1="50" x2="650" y2="50" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="100" x2="650" y2="100" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="150" x2="650" y2="150" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="200" x2="650" y2="200" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="250" x2="650" y2="250" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="300" x2="650" y2="300" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="350" x2="650" y2="350" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="50" y1="400" x2="650" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />

    <line x1="100" y1="50" x2="100" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="150" y1="50" x2="150" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="200" y1="50" x2="200" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="250" y1="50" x2="250" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="300" y1="50" x2="300" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="350" y1="50" x2="350" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="400" y1="50" x2="400" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="450" y1="50" x2="450" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="500" y1="50" x2="500" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="550" y1="50" x2="550" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="600" y1="50" x2="600" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
    <line x1="650" y1="50" x2="650" y2="400" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 4" />
  </g>

  <!-- Central Origin Axes (Threshold Boundaries) -->
  <line x1="350" y1="35" x2="350" y2="415" stroke="#94a3b8" stroke-width="1.8" />
  <line x1="35" y1="225" x2="665" y2="225" stroke="#94a3b8" stroke-width="1.8" />

  <!-- Quadrants Panels (Glassmorphism-Style Pastel Fills & Crisp Borders) -->
  <!-- Top Left: IR-Dominant -->
  <rect x="50" y="50" width="280" height="160" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" rx="10" />
  <text x="68" y="76" class="quadrant-title" fill="#b45309">QUADRANT II: IR-DOMINANT</text>
  
  <!-- Top Right: Dual Burden -->
  <rect x="370" y="50" width="280" height="160" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" rx="10" />
  <text x="388" y="76" class="quadrant-title" fill="#be123c">QUADRANT III: DUAL-BURDEN (THIN-FAT)</text>

  <!-- Bottom Left: MHNW (Healthy) -->
  <rect x="50" y="240" width="280" height="160" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2" rx="10" />
  <text x="68" y="384" class="quadrant-title" fill="#0f766e">QUADRANT I: HEALTHY (MHNW)</text>

  <!-- Bottom Right: Steatotic -->
  <rect x="370" y="240" width="280" height="160" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2" rx="10" />
  <text x="388" y="384" class="quadrant-title" fill="#1d4ed8">QUADRANT IV: STEATOTIC-DOMINANT</text>

  <!-- Background Cohort Scatter Scatter Simulation -->
  <!-- MHNW Cluster -->
  <circle cx="150" cy="300" r="3" class="cohort-dot mhnw" style="animation-delay: 0.1s;" />
  <circle cx="180" cy="340" r="2.5" class="cohort-dot mhnw" style="animation-delay: 0.5s;" />
  <circle cx="210" cy="280" r="3" class="cohort-dot mhnw" style="animation-delay: 0.9s;" />
  <circle cx="120" cy="320" r="3.5" class="cohort-dot mhnw" style="animation-delay: 0.2s;" />
  <circle cx="240" cy="310" r="2.5" class="cohort-dot mhnw" style="animation-delay: 1.4s;" />
  <circle cx="160" cy="270" r="3" class="cohort-dot mhnw" style="animation-delay: 0.7s;" />
  <circle cx="200" cy="350" r="3.5" class="cohort-dot mhnw" style="animation-delay: 1.1s;" />
  
  <!-- IR Cluster -->
  <circle cx="140" cy="110" r="3" class="cohort-dot ir" style="animation-delay: 0.3s;" />
  <circle cx="180" cy="150" r="3" class="cohort-dot ir" style="animation-delay: 0.8s;" />
  <circle cx="220" cy="100" r="2.5" class="cohort-dot ir" style="animation-delay: 1.2s;" />
  <circle cx="110" cy="160" r="3.5" class="cohort-dot ir" style="animation-delay: 0.4s;" />
  <circle cx="250" cy="140" r="2.5" class="cohort-dot ir" style="animation-delay: 1.6s;" />

  <!-- Steatosis Cluster -->
  <circle cx="480" cy="320" r="3" class="cohort-dot steatosis" style="animation-delay: 0.2s;" />
  <circle cx="520" cy="280" r="2.5" class="cohort-dot steatosis" style="animation-delay: 0.7s;" />
  <circle cx="450" cy="350" r="3.5" class="cohort-dot steatosis" style="animation-delay: 1.1s;" />
  <circle cx="560" cy="310" r="3" class="cohort-dot steatosis" style="animation-delay: 0.5s;" />
  <circle cx="490" cy="270" r="2.5" class="cohort-dot steatosis" style="animation-delay: 1.5s;" />

  <!-- Dual Burden Cluster -->
  <circle cx="490" cy="90" r="3" class="cohort-dot dual" style="animation-delay: 0.4s;" />
  <circle cx="530" cy="140" r="3.5" class="cohort-dot dual" style="animation-delay: 0.9s;" />
  <circle cx="460" cy="120" r="2.5" class="cohort-dot dual" style="animation-delay: 1.3s;" />
  <circle cx="570" cy="100" r="3" class="cohort-dot dual" style="animation-delay: 0.6s;" />
  <circle cx="510" cy="160" r="2.5" class="cohort-dot dual" style="animation-delay: 1.8s;" />

  <!-- Origin Dot -->
  <circle cx="350" cy="225" r="3" fill="#64748b" />

  <!-- The Geodesic Path -->
  <path id="geodesicPath" d="M 520 120 C 440 220, 260 210, 180 310" fill="none" class="geodesic-line" />

  <!-- Start & End Targets -->
  <circle cx="520" cy="120" r="6.5" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.8" />
  <circle cx="180" cy="310" r="6.5" fill="#0d9488" stroke="#ccfbf1" stroke-width="1.8" />
  
  <text x="535" y="116" class="label-text" fill="#be123c" font-weight="700">Patient Baseline (z_start)</text>
  <text x="90" y="334" class="label-text" fill="#0f766e" font-weight="700">Metabolic Target (z_safe)</text>

  <!-- Animated Patient Group (Core + Pulsing Outer Ring) -->
  <g>
    <circle r="6" class="patient-pulse-ring" />
    <circle r="5.5" class="patient-core-dot" />
    <animateMotion dur="7s" repeatCount="indefinite" keyTimes="0;0.18;0.5;0.68;1" keyPoints="0;0;1;1;0" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1">
      <mpath href="#geodesicPath" />
    </animateMotion>
  </g>

  <!-- Axes Labels -->
  <text x="630" y="245" class="axis-title">Z₁ (IR)</text>
  <path d="M 660 225 L 652 220 L 652 230 Z" fill="#94a3b8" />
  
  <text x="365" y="45" class="axis-title">Z₂ (Steatosis)</text>
  <path d="M 350 35 L 345 43 L 355 43 Z" fill="#94a3b8" />

  <!-- Live HUD Monitor Display -->
  <!-- Header Badge Overlay -->
  <rect x="230" y="15" width="240" height="30" fill="#ffffff" rx="15" stroke="#e2e8f0" stroke-width="1.2" />
  <text x="350" y="34" text-anchor="middle" class="title-text" fill="#0f172a">METABOLIC ATLAS</text>
  
  <!-- Running Metrics / Indicator -->
  <g transform="translate(490, 30)">
    <!-- Main Box -->
    <rect width="180" height="48" fill="#ffffff" rx="6" stroke="#e2e8f0" stroke-width="1.2" />
    
    <!-- Pulse indicator dot -->
    <circle cx="18" cy="24" r="4.5" fill="#6366f1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Animated ECG Waveform -->
    <path d="M 120 28 L 130 28 L 134 18 L 138 38 L 142 28 L 170 28" fill="none" class="ecg-path" />
    
    <!-- Titles -->
    <text x="30" y="20" font-family="'Outfit', sans-serif" font-size="8px" fill="#94a3b8" font-weight="700" letter-spacing="0.08em">GEODESIC PATHWAY</text>
    <text x="30" y="35" font-family="'Outfit', sans-serif" font-size="11px" fill="#6366f1" font-weight="700">solving ODE...</text>
  </g>
</svg>
