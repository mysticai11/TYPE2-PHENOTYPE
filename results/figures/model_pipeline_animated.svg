<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="60%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9f1239" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#115e59" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#831843" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing Line Filters -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;family=Fira+Code:wght@500;700&amp;display=swap');
    
    /* Core Canvas and Panel shapes */
    .panel-canvas { fill: url(#bgGrad); stroke: #1e293b; stroke-width: 1.5; }
    .card-outline { filter: url(#cardGlow); stroke-width: 1.2; }
    
    /* Typographic definitions */
    .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.15em; }
    .card-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; }
    .card-detail-text { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #94a3b8; font-weight: 400; line-height: 1.4; }
    .badge-label { font-family: 'Fira Code', monospace; font-size: 9px; font-weight: 700; fill: #ffffff; }
    
    /* Connections and Laser routes */
    .path-connector { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: round; }
    .laser-active-route { fill: none; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 8; stroke-linecap: round; filter: url(#laserGlow); }
    
    /* Keyframe Animations */
    @keyframes march-laser {
      to { stroke-dashoffset: -32; }
    }
    @keyframes card-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes anchor-pulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(219,39,119,0.2)); }
      50% { filter: drop-shadow(0 0 10px rgba(219,39,119,0.5)); }
    }

    .laser-marching {
      animation: march-laser 1.8s linear infinite;
    }
    .floating-element {
      animation: card-float 4.5s ease-in-out infinite;
    }
    .pulsing-anchor {
      animation: anchor-pulse 3s ease-in-out infinite;
    }
    
    /* Flow Particles */
    .flow-particle { fill: #6366f1; filter: url(#laserGlow); }
    .flow-particle-recon { fill: #10b981; filter: url(#laserGlow); }
    .flow-particle-anchor { fill: #f472b6; filter: url(#laserGlow); }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="panel-canvas" rx="28" />
  
  <!-- Grid Matrix Overlay -->
  <g opacity="0.12">
    <line x1="30" y1="0" x2="30" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="210" y1="0" x2="210" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="430" y1="0" x2="430" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="640" y1="0" x2="640" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    
    <line x1="0" y1="40" x2="840" y2="40" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="0" y1="200" x2="840" y2="200" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="0" y1="360" x2="840" y2="360" stroke="#94a3b8" stroke-width="0.5" />
  </g>

  <!-- SECTION LABELS -->
  <g transform="translate(30, 32)">
    <circle cx="0" cy="-3" r="3" fill="#64748b" />
    <text x="10" y="1" class="section-title">CLINICAL PROFILE INPUT</text>
  </g>
  <g transform="translate(240, 32)">
    <circle cx="0" cy="-3" r="3" fill="#6366f1" />
    <text x="10" y="1" class="section-title">DA-SS-iVAE NEURAL ENGINE</text>
  </g>
  <g transform="translate(630, 32)">
    <circle cx="0" cy="-3" r="3" fill="#f472b6" />
    <text x="10" y="1" class="section-title">BIOLOGICAL ANCHORS</text>
  </g>

  <!-- GRAPH CONNECTOR PATHS (BEHIND NODES) -->
  <!-- Path 1: Biomarkers -> Encoder -->
  <path id="pathBiomarkers" d="M 190 95 L 215 95 L 215 145 L 240 145" class="path-connector" />
  <!-- Path 2: Demographics -> Encoder -->
  <path id="pathDemo" d="M 190 205 L 215 205 L 215 165 L 240 165" class="path-connector" />
  <!-- Path 3: Encoder -> Latent Space -->
  <path id="pathEncoderLatent" d="M 400 155 L 450 155" class="laser-active-route laser-marching" />
  <!-- Path 4: Latent Space -> Decoder -->
  <path id="pathLatentDecoder" d="M 510 190 L 510 265 L 400 265" class="path-connector" />
  <!-- Path 5: Decoder -> Reconstructed Output -->
  <path id="pathDecoderOutput" d="M 240 265 L 110 265 L 110 140" class="path-connector" />
  <!-- Path 6: Latent Space -> Anchor 1 -->
  <path id="pathLatentAnchor1" d="M 570 145 L 595 145 L 595 105 L 630 105" class="laser-active-route laser-marching" stroke="#f472b6" />
  <!-- Path 7: Latent Space -> Anchor 2 -->
  <path id="pathLatentAnchor2" d="M 570 165 L 595 165 L 595 205 L 630 205" class="laser-active-route laser-marching" stroke="#f472b6" />

  <!-- ANIMATED DATA PACKETS -->
  <circle r="4.5" class="flow-particle">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 190 95 L 215 95 L 215 145 L 240 145" />
  </circle>
  <circle r="4.5" class="flow-particle">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 190 205 L 215 205 L 215 165 L 240 165" />
  </circle>
  <circle r="4.5" class="flow-particle">
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 400 155 L 450 155" />
  </circle>
  <circle r="4.5" class="flow-particle-recon">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 510 190 L 510 265 L 400 265" />
  </circle>
  <circle r="4.5" class="flow-particle-recon">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 240 265 L 110 265 L 110 140" />
  </circle>
  <circle r="4.5" class="flow-particle-anchor">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 570 145 L 595 145 L 595 105 L 630 105" />
  </circle>
  <circle r="4.5" class="flow-particle-anchor">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 570 165 L 595 165 L 595 205 L 630 205" />
  </circle>

  <!-- Reconstructs Overlay Label -->
  <g transform="translate(110, 265)">
    <rect x="-40" y="-10" width="80" height="20" fill="#070a13" stroke="#1e293b" stroke-width="0.8" rx="5" />
    <text x="0" y="3" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8px" font-weight="700" fill="#10b981" letter-spacing="0.05em">RECONSTRUCTS</text>
  </g>

  <!-- PIPELINE CARD NODES -->

  <!-- Card 1: 14 Biomarkers -->
  <g transform="translate(30, 60)" class="floating-element">
    <rect width="160" height="70" class="card-outline" fill="url(#cardBaseGrad)" stroke="#1e293b" rx="14" />
    <!-- Syringe Vector Icon -->
    <path d="M135 20 L145 30 M138 23 C143 23 147 27 147 32 C147 37 138 45 138 45 C138 45 130 37 130 32 C130 27 134 23 138 23 Z" fill="none" stroke="#475569" stroke-width="1.2" />
    <text x="14" y="24" class="card-title">14 Biomarkers</text>
    <text x="14" y="42" class="card-detail-text">Glucose, Insulin, Lipids,</text>
    <text x="14" y="54" class="card-detail-text">AST, ALT, GGT, Platelets</text>
    <rect x="14" y="-8" width="22" height="14" fill="#334155" rx="4" />
    <text x="25" y="3" text-anchor="middle" class="badge-label">x</text>
  </g>

  <!-- Card 2: Demographics -->
  <g transform="translate(30, 170)" class="floating-element" style="animation-delay: 1s;">
    <rect width="160" height="70" class="card-outline" fill="url(#cardBaseGrad)" stroke="#1e293b" rx="14" />
    <!-- Profile Vector Icon -->
    <circle cx="138" cy="30" r="6" fill="none" stroke="#475569" stroke-width="1.2" />
    <path d="M128 44 C128 39 132 37 138 37 C144 37 148 39 148 44" fill="none" stroke="#475569" stroke-width="1.2" />
    <text x="14" y="24" class="card-title">Demographics</text>
    <text x="14" y="42" class="card-detail-text">Age, Sex, Ancestry Proxy</text>
    <text x="14" y="54" class="card-detail-text">Conditioning auxiliaries</text>
    <rect x="14" y="-8" width="22" height="14" fill="#334155" rx="4" />
    <text x="25" y="3" text-anchor="middle" class="badge-label">u</text>
  </g>

  <!-- Card 3: Conditional Encoder -->
  <g transform="translate(240, 105)" class="floating-element" style="animation-delay: 0.5s;">
    <rect width="160" height="95" class="card-outline" fill="url(#purpleGrad)" stroke="#8b5cf6" rx="14" />
    <text x="14" y="26" class="card-title" fill="#a78bfa">Conditional Encoder</text>
    <text x="14" y="46" class="card-detail-text" fill="#a78bfa">Posterior mapping</text>
    <text x="14" y="58" class="card-detail-text" fill="#a78bfa">q_φ(z|x,u) translates profile</text>
    <text x="14" y="70" class="card-detail-text" fill="#a78bfa">to 2D latent coordinates</text>
    <rect x="14" y="-8" width="34" height="14" fill="#7c3aed" rx="4" />
    <text x="31" y="3" text-anchor="middle" class="badge-label">q_φ</text>
  </g>

  <!-- Card 4: 2D Latent Space -->
  <g transform="translate(450, 115)" class="floating-element" style="animation-delay: 1.5s;">
    <rect width="120" height="75" class="card-outline" fill="url(#roseGrad)" stroke="#f43f5e" rx="14" />
    <!-- Grid Coordinate Vector Icon -->
    <path d="M102 20 L102 40 M92 30 L112 30" fill="none" stroke="#be123c" stroke-width="1.2" />
    <circle cx="102" cy="30" r="2.5" fill="#f43f5e" />
    <text x="14" y="26" class="card-title" fill="#fda4af">2D Latent Space</text>
    <text x="14" y="46" class="card-detail-text" fill="#fda4af">z₁ = Insulin Axis</text>
    <text x="14" y="58" class="card-detail-text" fill="#fda4af">z₂ = Steatosis Axis</text>
    <rect x="14" y="-8" width="22" height="14" fill="#e11d48" rx="4" />
    <text x="25" y="3" text-anchor="middle" class="badge-label">z</text>
  </g>

  <!-- Card 5: Biomarker Decoder -->
  <g transform="translate(240, 230)" class="floating-element" style="animation-delay: 2s;">
    <rect width="160" height="70" class="card-outline" fill="url(#tealGrad)" stroke="#14b8a6" rx="14" />
    <text x="14" y="24" class="card-title" fill="#5eead4">Biomarker Decoder</text>
    <text x="14" y="42" class="card-detail-text" fill="#2dd4bf">Reconstructs x_hat from z</text>
    <text x="14" y="54" class="card-detail-text" fill="#2dd4bf">optimizing latent manifold</text>
    <rect x="14" y="-8" width="34" height="14" fill="#0d9488" rx="4" />
    <text x="31" y="3" text-anchor="middle" class="badge-label">p_θ</text>
  </g>

  <!-- Card 6: Monotone Anchor 1 -->
  <g transform="translate(630, 60)" class="pulsing-anchor">
    <rect width="180" height="85" class="card-outline" fill="url(#pinkGrad)" stroke="#ec4899" rx="14" />
    <!-- Monotone Upwards Arrow Symbol -->
    <path d="M152 24 L162 24 M157 18 L157 30 M154 28 L160 20" fill="none" stroke="#f472b6" stroke-width="1.5" />
    <text x="14" y="24" class="card-title" fill="#f472b6">Anchor 1: g₁(z₁)</text>
    <text x="14" y="42" class="card-detail-text" fill="#f472b6">Strict Monotone Constraint</text>
    <text x="14" y="58" class="card-title" fill="#f8fafc" font-size="11px">Target: HOMA-IR</text>
    <text x="14" y="70" class="card-detail-text" fill="#f472b6">Systemic Insulin Resistance</text>
  </g>

  <!-- Card 7: Monotone Anchor 2 -->
  <g transform="translate(630, 165)" class="pulsing-anchor" style="animation-delay: 0.5s;">
    <rect width="180" height="85" class="card-outline" fill="url(#pinkGrad)" stroke="#ec4899" rx="14" />
    <!-- Monotone Upwards Arrow Symbol -->
    <path d="M152 24 L162 24 M157 18 L157 30 M154 28 L160 20" fill="none" stroke="#f472b6" stroke-width="1.5" />
    <text x="14" y="24" class="card-title" fill="#f472b6">Anchor 2: g₂(z₂)</text>
    <text x="14" y="42" class="card-detail-text" fill="#f472b6">Masked Semi-Supervised fit</text>
    <text x="14" y="58" class="card-title" fill="#f8fafc" font-size="11px">Target: FibroScan CAP</text>
    <text x="14" y="70" class="card-detail-text" fill="#f472b6">Gold-standard Liver Steatosis</text>
  </g>
</svg>
