<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <!-- Premium Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fdfdfd" />
      <stop offset="100%" stop-color="#f4f6fa" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="latentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="anchorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fbcfe8" />
    </linearGradient>

    <!-- Card Drop Shadows -->
    <filter id="premiumShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
    
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    
    /* Global classes */
    .panel-canvas { fill: url(#bgGlow); stroke: #e2e8f0; stroke-width: 1.5; }
    .card-base { filter: url(#premiumShadow); stroke-width: 1; }
    
    /* Typography */
    .sec-title { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.15em; }
    .c-header { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
    .c-detail { font-family: 'Outfit', sans-serif; font-size: 10px; fill: #475569; font-weight: 400; line-height: 1.4; }
    .c-math { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #6366f1; }
    .badge-text { font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; letter-spacing: 0.05em; }
    
    /* Connector lines */
    .conn-line { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; }
    .conn-line-active { fill: none; stroke: #6366f1; stroke-width: 2; stroke-dasharray: 6 6; stroke-linecap: round; }
    
    /* Keyframe Animations */
    @keyframes pulse-ring {
      0% { r: 4px; opacity: 0.8; }
      100% { r: 12px; opacity: 0; }
    }
    @keyframes float-card {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes laser-flow {
      to { stroke-dashoffset: -30; }
    }
    @keyframes anchor-wave {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(236,72,153,0.1)); }
      50% { filter: drop-shadow(0 0 8px rgba(236,72,153,0.4)); }
    }

    .laser-active {
      animation: laser-flow 1.5s linear infinite;
    }
    
    .floating-c {
      animation: float-card 4s ease-in-out infinite;
    }
    .anchor-glow {
      animation: anchor-wave 3s ease-in-out infinite;
    }
    
    /* Flow Packets */
    .flow-dot { fill: #6366f1; filter: url(#glowFilter); }
    .flow-dot-recon { fill: #0d9488; filter: url(#glowFilter); }
    .flow-dot-anchor { fill: #db2777; filter: url(#glowFilter); }
  </style>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="panel-canvas" rx="20" />
  
  <!-- Subtle Grid Pattern overlay for tech aesthetic -->
  <g opacity="0.12">
    <line x1="30" y1="0" x2="30" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="210" y1="0" x2="210" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="430" y1="0" x2="430" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="640" y1="0" x2="640" y2="400" stroke="#94a3b8" stroke-width="0.5" />
    
    <line x1="0" y1="40" x2="840" y2="40" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="0" y1="200" x2="840" y2="200" stroke="#94a3b8" stroke-width="0.5" />
    <line x1="0" y1="360" x2="840" y2="360" stroke="#94a3b8" stroke-width="0.5" />
  </g>

  <!-- SECTION TITLE LABELS -->
  <g transform="translate(30, 32)">
    <circle cx="0" cy="-3" r="3" fill="#94a3b8" />
    <text x="10" y="1" class="sec-title">CLINICAL INPUT PROFILE</text>
  </g>
  <g transform="translate(240, 32)">
    <circle cx="0" cy="-3" r="3" fill="#6366f1" />
    <text x="10" y="1" class="sec-title">DA-SS-iVAE PIPELINE</text>
  </g>
  <g transform="translate(630, 32)">
    <circle cx="0" cy="-3" r="3" fill="#db2777" />
    <text x="10" y="1" class="sec-title">BIOLOGICAL ANCHORS</text>
  </g>

  <!-- PIPELINE CONNECTIONS (BEHIND CARDS) -->
  <!-- Path 1: Biomarkers -> Encoder -->
  <path id="biomarkerToEncoder" d="M 190 95 L 215 95 L 215 145 L 240 145" class="conn-line" />
  <!-- Path 2: Demographics -> Encoder -->
  <path id="demoToEncoder" d="M 190 205 L 215 205 L 215 165 L 240 165" class="conn-line" />
  <!-- Path 3: Encoder -> Latent Space -->
  <path id="encoderToLatent" d="M 400 155 L 450 155" class="conn-line-active laser-active" />
  <!-- Path 4: Latent Space -> Decoder -->
  <path id="latentToDecoder" d="M 510 190 L 510 265 L 400 265" class="conn-line" />
  <!-- Path 5: Decoder -> Reconstructs -->
  <path id="decoderToRecon" d="M 240 265 L 110 265 L 110 140" class="conn-line" />
  <!-- Path 6: Latent Space -> Anchor 1 -->
  <path id="latentToAnchor1" d="M 570 145 L 595 145 L 595 105 L 630 105" class="conn-line-active laser-active" stroke="#f472b6" />
  <!-- Path 7: Latent Space -> Anchor 2 -->
  <path id="latentToAnchor2" d="M 570 165 L 595 165 L 595 205 L 630 205" class="conn-line-active laser-active" stroke="#f472b6" />

  <!-- ANIMATED DATA FLOW PACKETS -->
  <circle r="4" class="flow-dot">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 190 95 L 215 95 L 215 145 L 240 145" />
  </circle>
  <circle r="4" class="flow-dot">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 190 205 L 215 205 L 215 165 L 240 165" />
  </circle>
  <circle r="4" class="flow-dot">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 400 155 L 450 155" />
  </circle>
  <circle r="4" class="flow-dot-recon">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 510 190 L 510 265 L 400 265" />
  </circle>
  <circle r="4" class="flow-dot-recon">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 240 265 L 110 265 L 110 140" />
  </circle>
  <circle r="4" class="flow-dot-anchor">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 570 145 L 595 145 L 595 105 L 630 105" />
  </circle>
  <circle r="4" class="flow-dot-anchor">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 570 165 L 595 165 L 595 205 L 630 205" />
  </circle>

  <!-- Dynamic Labels on Paths -->
  <g transform="translate(110, 265)">
    <rect x="-35" y="-9" width="70" height="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" rx="4" />
    <text x="0" y="3" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8px" font-weight="700" fill="#0d9488" letter-spacing="0.05em">RECONSTRUCTS</text>
  </g>

  <!-- CARDS SECTION -->

  <!-- CARD 1: 14 Biomarkers -->
  <g transform="translate(30, 60)" class="floating-c">
    <rect width="160" height="70" class="card-base" fill="url(#inputGrad)" stroke="#cbd5e1" rx="12" />
    <!-- Icon: Syringe / Blood tube -->
    <path d="M135 20 L145 30 M138 23 C143 23 147 27 147 32 C147 37 138 45 138 45 C138 45 130 37 130 32 C130 27 134 23 138 23 Z" fill="none" stroke="#64748b" stroke-width="1.2" />
    <text x="14" y="24" class="c-header">14 Blood Biomarkers</text>
    <text x="14" y="42" class="c-detail">Glucose, Insulin, Lipids,</text>
    <text x="14" y="54" class="c-detail">AST, ALT, GGT, Platelets</text>
    <rect x="14" y="-7" width="22" height="14" fill="#64748b" rx="3" />
    <text x="25" y="3" text-anchor="middle" class="badge-text">x</text>
  </g>

  <!-- CARD 2: Demographics -->
  <g transform="translate(30, 170)" class="floating-c" style="animation-delay: 1s;">
    <rect width="160" height="70" class="card-base" fill="url(#inputGrad)" stroke="#cbd5e1" rx="12" />
    <!-- Icon: Profile -->
    <circle cx="138" cy="30" r="6" fill="none" stroke="#64748b" stroke-width="1.2" />
    <path d="M128 44 C128 39 132 37 138 37 C144 37 148 39 148 44" fill="none" stroke="#64748b" stroke-width="1.2" />
    <text x="14" y="24" class="c-header">Demographics</text>
    <text x="14" y="42" class="c-detail">Age, Sex, Ancestry Proxy</text>
    <text x="14" y="54" class="c-detail">Conditioning variables</text>
    <rect x="14" y="-7" width="22" height="14" fill="#475569" rx="3" />
    <text x="25" y="3" text-anchor="middle" class="badge-text">u</text>
  </g>

  <!-- CARD 3: Conditional Encoder -->
  <g transform="translate(240, 105)" class="floating-c" style="animation-delay: 0.5s;">
    <rect width="160" height="95" class="card-base" fill="url(#encoderGrad)" stroke="#c084fc" rx="12" />
    <text x="14" y="26" class="c-header" fill="#5b21b6">Conditional Encoder</text>
    <text x="14" y="46" class="c-detail" fill="#6d28d9">Neural Posterior mapping</text>
    <text x="14" y="58" class="c-detail" fill="#6d28d9">routine profile into a</text>
    <text x="14" y="70" class="c-detail" fill="#6d28d9">low-dimensional space</text>
    <rect x="14" y="-7" width="34" height="14" fill="#7c3aed" rx="3" />
    <text x="31" y="3" text-anchor="middle" class="badge-text">q_φ</text>
  </g>

  <!-- CARD 4: 2D Latent Space -->
  <g transform="translate(450, 115)" class="floating-c" style="animation-delay: 1.5s;">
    <rect width="120" height="75" class="card-base" fill="url(#latentGrad)" stroke="#f43f5e" rx="12" />
    <!-- Icon: Grid Coordinate -->
    <path d="M102 20 L102 40 M92 30 L112 30" fill="none" stroke="#be123c" stroke-width="1" />
    <circle cx="102" cy="30" r="2" fill="#be123c" />
    <text x="14" y="26" class="c-header" fill="#9f1239">2D Latent Space</text>
    <text x="14" y="46" class="c-detail" fill="#e11d48">z₁ = Insulin Axis</text>
    <text x="14" y="58" class="c-detail" fill="#e11d48">z₂ = Steatosis Axis</text>
    <rect x="14" y="-7" width="22" height="14" fill="#e11d48" rx="3" />
    <text x="25" y="3" text-anchor="middle" class="badge-text">z</text>
  </g>

  <!-- CARD 5: Biomarker Decoder -->
  <g transform="translate(240, 230)" class="floating-c" style="animation-delay: 2s;">
    <rect width="160" height="70" class="card-base" fill="url(#decoderGrad)" stroke="#2dd4bf" rx="12" />
    <text x="14" y="24" class="c-header" fill="#0f766e">Biomarker Decoder</text>
    <text x="14" y="42" class="c-detail" fill="#0d9488">Reconstructs x from z</text>
    <text x="14" y="54" class="c-detail" fill="#0d9488">to capture non-linear ties</text>
    <rect x="14" y="-7" width="34" height="14" fill="#0d9488" rx="3" />
    <text x="31" y="3" text-anchor="middle" class="badge-text">p_θ</text>
  </g>

  <!-- CARD 6: Monotone Anchor 1 -->
  <g transform="translate(630, 60)" class="anchor-glow">
    <rect width="180" height="85" class="card-base" fill="url(#anchorGrad)" stroke="#f472b6" rx="12" />
    <!-- Monotone Symbol -->
    <path d="M152 24 L162 24 M157 18 L157 30 M154 28 L160 20" fill="none" stroke="#db2777" stroke-width="1.2" />
    <text x="14" y="24" class="c-header" fill="#9d174d">Anchor 1: g₁(z₁)</text>
    <text x="14" y="42" class="c-detail" fill="#db2777">Monotonic target alignment</text>
    <text x="14" y="58" class="c-header" fill="#9d174d" font-size="11px">Target: HOMA-IR</text>
    <text x="14" y="70" class="c-detail" fill="#c2185b">Insulin/Glucose feedback loop</text>
  </g>

  <!-- CARD 7: Monotone Anchor 2 -->
  <g transform="translate(630, 165)" class="anchor-glow" style="animation-delay: 0.5s;">
    <rect width="180" height="85" class="card-base" fill="url(#anchorGrad)" stroke="#f472b6" rx="12" />
    <!-- Monotone Symbol -->
    <path d="M152 24 L162 24 M157 18 L157 30 M154 28 L160 20" fill="none" stroke="#db2777" stroke-width="1.2" />
    <text x="14" y="24" class="c-header" fill="#9d174d">Anchor 2: g₂(z₂)</text>
    <text x="14" y="42" class="c-detail" fill="#db2777">Masked Semi-Supervised fit</text>
    <text x="14" y="58" class="c-header" fill="#9d174d" font-size="11px">Target: FibroScan CAP</text>
    <text x="14" y="70" class="c-detail" fill="#c2185b">Gold-standard ultrasound liver fat</text>
  </g>
</svg>
